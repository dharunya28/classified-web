<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classified Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Classified Hub</h1>
        <p>Buy & Sell Used Products</p>
    </header>


    <!-- Navigation -->
    <nav>
        <button onclick="showHome()">Home</button>

        <button onclick="showSell()">Sell Product</button>
    </nav>


    <!-- Home -->
    <section id="home">

        <h2>Available Products</h2>


        <!-- Search -->
        <input
            type="text"
            id="search"
            placeholder="Search products..."
            onkeyup="displayProducts()"
        >


        <!-- Category -->
        <select
            id="category"
            onchange="displayProducts()"
        >
            <option value="All">All Categories</option>

            <option value="Electronics">
                Electronics
            </option>

            <option value="Furniture">
                Furniture
            </option>

            <option value="Books">
                Books
            </option>

            <option value="Vehicles">
                Vehicles
            </option>
        </select>


        <!-- Product List -->
        <div id="productList"></div>

    </section>



    <!-- Sell Product -->
    <section id="sell">

        <h2>Sell Your Product</h2>


        <input
            type="text"
            id="productName"
            placeholder="Product Name"
        >


        <input
            type="number"
            id="price"
            placeholder="Price"
        >


        <select id="productCategory">

            <option value="Electronics">
                Electronics
            </option>

            <option value="Furniture">
                Furniture
            </option>

            <option value="Books">
                Books
            </option>

            <option value="Vehicles">
                Vehicles
            </option>

        </select>


        <input
            type="text"
            id="image"
            placeholder="Image URL"
        >


        <textarea
            id="description"
            placeholder="Product Description"
        ></textarea>


        <button onclick="addProduct()">
            Add Product
        </button>

    </section>


    <script src="script.js"></script>

</body>

</html>
